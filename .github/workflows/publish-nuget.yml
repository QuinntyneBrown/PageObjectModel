name: Publish to NuGet

# Pull requests build, test, pack, and smoke-test both NuGet packages. Pushes to main run the
# same validation and then publish. Versions that already exist are skipped safely.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only needs to read the repo; the NuGet credential is a secret.
permissions:
  contents: read

# Never run two publishes at once (e.g. two quick commits); don't cancel an in-flight push.
concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The analysis engine and the 'bridge' command use the Node TypeScript AST sidecar.
      - name: Install sidecar dependencies
        working-directory: src/PlaywrightPomGenerator.Sidecar.Node
        run: npm ci

      # Unquoted glob: bash expands it (Node 20 does not glob --test args itself).
      - name: Test sidecar (node:test)
        working-directory: src/PlaywrightPomGenerator.Sidecar.Node
        run: node --test test/*.test.js

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/PlaywrightPomGenerator.Core/PlaywrightPomGenerator.Core.csproj --configuration Release --no-build --output "${{ runner.temp }}/nupkg"
          dotnet pack src/PlaywrightPomGenerator.Cli/PlaywrightPomGenerator.Cli.csproj --configuration Release --no-build --output "${{ runner.temp }}/nupkg"

      # Put Core behind an intermediary NuGet library, then restore real net8.0 and net9.0
      # applications. This verifies compile assets, dependencies, buildTransitive sidecar copy,
      # and the CodeGenerator-style transitive consumption path.
      - name: Smoke test packed Core library
        shell: bash
        run: |
          set -euo pipefail
          CORE_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/PlaywrightPomGenerator.Core/PlaywrightPomGenerator.Core.csproj)
          SMOKE_PACKAGES="${{ runner.temp }}/smoke-nupkg"
          INTERMEDIARY="${{ runner.temp }}/core-intermediary"
          CONSUMER="${{ runner.temp }}/core-consumer"
          mkdir -p "$SMOKE_PACKAGES" "$INTERMEDIARY" "$CONSUMER"

          cat > "$INTERMEDIARY/CoreIntermediary.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>net8.0;net9.0</TargetFrameworks>
              <PackageId>PpgCoreSmoke.Intermediary</PackageId>
              <Version>1.0.0</Version>
              <RestoreSources>${{ runner.temp }}/nupkg;https://api.nuget.org/v3/index.json</RestoreSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="PlaywrightPomGenerator.Core" Version="$CORE_VERSION" />
            </ItemGroup>
          </Project>
          EOF

          dotnet pack "$INTERMEDIARY/CoreIntermediary.csproj" --configuration Release --output "$SMOKE_PACKAGES"

          cat > "$CONSUMER/CoreSmoke.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFrameworks>net8.0;net9.0</TargetFrameworks>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <RestoreSources>$SMOKE_PACKAGES;${{ runner.temp }}/nupkg;https://api.nuget.org/v3/index.json</RestoreSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="PpgCoreSmoke.Intermediary" Version="1.0.0" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$CONSUMER/Program.cs" <<'EOF'
          using Microsoft.Extensions.Logging.Abstractions;
          using Microsoft.Extensions.Options;
          using PlaywrightPomGenerator.Core.Models;
          using PlaywrightPomGenerator.Core.Services;

          var templates = new TemplateEngine(Options.Create(new GeneratorOptions { ToolVersion = "2.0.0" }));
          if (!templates.GenerateBasePage().Contains("BasePage", StringComparison.Ordinal))
          {
              throw new InvalidOperationException("The public template API did not produce BasePage output.");
          }

          var sidecarPath = SidecarLocator.Locate();
          if (!File.Exists(sidecarPath))
          {
              throw new FileNotFoundException("The packaged sidecar was not copied to the consumer output.", sidecarPath);
          }

          var sourceRoot = Environment.GetEnvironmentVariable("PPG_SIDECAR_SOURCE_ROOT")
              ?? throw new InvalidOperationException("PPG_SIDECAR_SOURCE_ROOT is required.");
          var transport = new NodeSidecarTransport(
              "node",
              sidecarPath,
              NullLogger<NodeSidecarTransport>.Instance,
              TimeSpan.FromSeconds(30));
          var response = await transport.InvokeAsync("ping", new { root = sourceRoot });
          if (response.GetString() != "pong")
          {
              throw new InvalidOperationException("The packaged sidecar did not respond to ping.");
          }

          Console.WriteLine($"Core package smoke test passed; sidecar: {sidecarPath}");
          EOF

          dotnet restore "$CONSUMER/CoreSmoke.csproj"
          dotnet build "$CONSUMER/CoreSmoke.csproj" --configuration Release --no-restore
          export PPG_SIDECAR_SOURCE_ROOT="$GITHUB_WORKSPACE/src/PlaywrightPomGenerator.Sidecar.Node"
          dotnet run --project "$CONSUMER/CoreSmoke.csproj" --configuration Release --framework net8.0 --no-build
          dotnet run --project "$CONSUMER/CoreSmoke.csproj" --configuration Release --framework net9.0 --no-build

      # Smoke test the PACKED tool: the only pre-publish exercise of the real nupkg
      # sidecar layout (tools/net8.0/any/sidecar/). Asserts the AST engine works from
      # the shipped sidecar and that the regex escape hatch stays green.
      - name: Smoke test packed tool
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/PlaywrightPomGenerator.Cli/PlaywrightPomGenerator.Cli.csproj)
          dotnet tool install --global PlaywrightPomGenerator --version "$VERSION" --add-source "${{ runner.temp }}/nupkg"

          FIXTURE="${{ runner.temp }}/smoke-app"
          mkdir -p "$FIXTURE/src/app"
          cat > "$FIXTURE/package.json" <<'EOF'
          {
            "name": "smoke-app",
            "dependencies": { "@angular/core": "^19.2.0", "@angular/compiler": "^19.2.0" },
            "devDependencies": { "typescript": "~5.7.0" }
          }
          EOF
          cat > "$FIXTURE/src/app/home.component.ts" <<'EOF'
          import { Component } from '@angular/core';
          @Component({
            selector: 'app-home',
            template: '<button data-testid="go">Go</button>'
          })
          export class HomeComponent {}
          EOF
          (cd "$FIXTURE" && npm install --no-audit --no-fund --legacy-peer-deps typescript @angular/compiler)

          OUT=$(ppg app "$FIXTURE" -o "${{ runner.temp }}/smoke-out")
          echo "$OUT"
          echo "$OUT" | grep -q "Analysis engine: AST" || { echo "expected the AST engine from the shipped sidecar"; exit 1; }

          OUT2=$(ppg app "$FIXTURE" -o "${{ runner.temp }}/smoke-out-regex" --engine regex --no-component-objects)
          echo "$OUT2"
          echo "$OUT2" | grep -q "Analysis engine: regex" || { echo "expected the regex engine banner"; exit 1; }

      # Pushing the .nupkg auto-publishes the adjacent .snupkg symbols; the explicit symbols
      # push below is a belt-and-suspenders no-op (--skip-duplicate) in case it does not.
      - name: Push package to NuGet
        if: github.event_name == 'push'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "${{ runner.temp }}/nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: Push symbols to NuGet
        if: github.event_name == 'push'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "${{ runner.temp }}/nupkg/*.snupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

